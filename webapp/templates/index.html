<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Failure Prediction</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#1c2024; --muted:#6b7280; --line:#e2e5ea;
    --soft:#fbfcfd; --hover:#eef1f5; --sel:#e6eef7;
    --blue:#3b6ea5; --red:#c1442e; --amber:#d99a2b; --green:#4f7d3a; --grey:#96a0ac;
    --okbg:#eaf1e6; --actbg:#fbe9e5; --warnbg:#fdf3e0; --warnink:#8a6414;
    --errbg:#fdece8; --errline:#f0c3b8; --errink:#8c2f1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14171b; --card:#1b1f24; --ink:#e6e9ed; --muted:#98a2ae; --line:#2b3138;
      --soft:#1f242a; --hover:#242a31; --sel:#243444;
      --blue:#6fa3d8; --red:#e2755c; --amber:#e0ae52; --green:#8ab86a; --grey:#6b7683;
      --okbg:#22301f; --actbg:#3a2220; --warnbg:#362c17; --warnink:#e0ae52;
      --errbg:#3a201c; --errline:#5d3229; --errink:#f0b0a0;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14171b; --card:#1b1f24; --ink:#e6e9ed; --muted:#98a2ae; --line:#2b3138;
    --soft:#1f242a; --hover:#242a31; --sel:#243444;
    --blue:#6fa3d8; --red:#e2755c; --amber:#e0ae52; --green:#8ab86a; --grey:#6b7683;
    --okbg:#22301f; --actbg:#3a2220; --warnbg:#362c17; --warnink:#e0ae52;
    --errbg:#3a201c; --errline:#5d3229; --errink:#f0b0a0;
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line);
           padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
           position:sticky; top:0; z-index:5; }
  h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:-.01em; }
  h2 { font-size:13px; margin:0 0 10px; font-weight:650; }
  .sub { color:var(--muted); font-size:12.5px; }
  main { max-width:1180px; margin:0 auto; padding:18px 20px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:9px;
          padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .spacer { flex:1; }
  .note { color:var(--muted); font-size:12.5px; }
  .mono { font-family:"SF Mono",Consolas,"Courier New",monospace; font-size:12.5px; }
  .hidden { display:none; }
  a { color:var(--blue); }

  /* controls */
  button, select { padding:6px 12px; border:1px solid var(--line); background:var(--card);
           border-radius:6px; cursor:pointer; font:inherit; font-size:13px; color:var(--ink); }
  button:hover, select:hover { background:var(--hover); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px;
         overflow:hidden; }
  .seg button { border:0; border-radius:0; border-right:1px solid var(--line);
                padding:6px 13px; }
  .seg button:last-child { border-right:0; }
  .seg button.on { background:var(--sel); color:var(--ink); font-weight:600; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px;
          padding:5px 12px; cursor:pointer; font-size:12.5px; }
  .chip:hover { background:var(--hover); border-color:var(--blue); }
  .chip.example { background:var(--sel); border-color:var(--line); }

  #drop { border:2px dashed var(--line); border-radius:10px; padding:30px 20px;
          text-align:center; background:var(--soft); cursor:pointer; transition:.12s; }
  #drop:hover, #drop.over { border-color:var(--blue); background:var(--sel); }
  #drop .big { font-size:16px; font-weight:600; margin-bottom:4px; }

  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line);
          vertical-align:middle; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
       font-weight:600; }
  td.num, th.num { text-align:right; }
  tbody tr.click { cursor:pointer; }
  tbody tr.click:hover { background:var(--hover); }
  tbody tr.sel { background:var(--sel); }

  .bar { position:relative; height:9px; background:var(--line); border-radius:5px;
         min-width:72px; overflow:visible; }
  .bar .fill { position:absolute; inset:0 auto 0 0; border-radius:5px; }
  .bar .thr { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink);
              opacity:.45; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px;
          font-weight:600; white-space:nowrap; }
  .pill.act { background:var(--actbg); color:var(--red); }
  .pill.ok  { background:var(--okbg); color:var(--green); }
  .pill.warn{ background:var(--warnbg); color:var(--warnink); }
  .pill.tag { background:var(--sel); color:var(--muted); font-weight:500; }

  .kpis { display:flex; gap:26px; flex-wrap:wrap; }
  .kpi .n { font-size:20px; font-weight:650; font-variant-numeric:tabular-nums;
            line-height:1.25; }
  .kpi .l { font-size:11.5px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .spark { border:1px solid var(--line); border-radius:6px; padding:8px 10px;
           background:var(--soft); }
  .spark .name { font-size:11px; color:var(--muted);
                 font-family:"SF Mono",Consolas,monospace; }
  .spark .val { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .spark .med { font-size:10.5px; color:var(--muted); }

  .panes { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .mcard { border:1px solid var(--line); border-radius:8px; padding:12px 14px;
           background:var(--soft); }
  .mcard.on { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue) inset; }
  .mcard .hd { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  .mcard .hd strong { font-size:14px; }
  .mstats { display:flex; gap:18px; flex-wrap:wrap; margin:8px 0 6px; }
  .mstats div { font-size:11.5px; color:var(--muted); }
  .mstats b { display:block; font-size:15px; color:var(--ink); font-weight:650;
              font-variant-numeric:tabular-nums; }

  .contrib { display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; }
  .contrib .cname { font-family:"SF Mono",Consolas,monospace; font-size:11.5px; }
  .cbar { position:relative; height:13px; width:100%; }
  .cbar i { position:absolute; top:2px; height:9px; border-radius:2px; display:block; }
  .cbar .axis { position:absolute; top:0; bottom:0; width:1px; background:var(--line); }

  .err { background:var(--errbg); border:1px solid var(--errline); color:var(--errink);
         border-radius:8px; padding:12px 14px; }
  details summary { cursor:pointer; font-weight:600; font-size:13px; }
  details[open] summary { margin-bottom:10px; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line);
          border-top-color:var(--blue); border-radius:50%; animation:sp .8s linear infinite;
          vertical-align:-2px; margin-right:7px; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* upload feedback: a progress bar while the bytes move, a toast when it lands */
  .prog { height:6px; background:var(--line); border-radius:4px; overflow:hidden;
          margin-top:10px; }
  .prog i { display:block; height:100%; width:0; background:var(--blue);
            border-radius:4px; transition:width .15s linear; }
  .prog.indet i { width:35%; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }

  #toasts { position:fixed; right:18px; bottom:18px; z-index:60; display:flex;
            flex-direction:column; gap:10px; width:min(400px, calc(100vw - 36px));
            pointer-events:none; }
  .toast { background:var(--card); border:1px solid var(--line); border-left:4px solid;
           border-radius:8px; padding:11px 13px; box-shadow:0 8px 28px rgba(0,0,0,.18);
           animation:pop .18s ease-out; pointer-events:auto; }
  .toast.ok  { border-left-color:var(--green); }
  .toast.err { border-left-color:var(--red); }
  .toast.info{ border-left-color:var(--blue); }
  .toast .tt { font-weight:650; font-size:13.5px; display:flex; gap:7px;
               align-items:baseline; }
  .toast .tb { font-size:12.5px; color:var(--muted); margin-top:3px; }
  .toast .tx { margin-left:auto; cursor:pointer; color:var(--muted); border:0;
               background:none; font-size:16px; line-height:1; padding:0 2px; }
  .toast .ta { margin-top:8px; font-size:12.5px; padding:4px 10px; }
  @keyframes pop { from { opacity:0; transform:translateY(8px); } }
  @keyframes flash { 0%,100% { box-shadow:0 0 0 0 transparent; }
                     30% { box-shadow:0 0 0 3px var(--sel); } }
  .flash { animation:flash 1.1s ease-out; }
  .swatch { display:inline-block; width:9px; height:9px; border-radius:2px;
            vertical-align:0; margin-right:4px; }
</style>
</head>
<body>

<header>
  <h1>Drive Failure Prediction</h1>
  <span class="sub" id="hdr">loading…</span>
  <span class="spacer"></span>
  <button id="theme" title="light / dark">◐</button>
</header>

<main>

  <!-- ============================ the model ============================ -->
  <div class="card" id="modelcard">
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0">Model</h2>
      <select id="runpick"></select>
      <span class="pill tag" id="runtag"></span>
      <span class="spacer"></span>
      <span class="note">score with</span>
      <span class="seg" id="kindpick"></span>
    </div>
    <p class="note" id="runnote" style="margin:0 0 12px"></p>
    <div class="panes" id="mcards"></div>
    <div id="modeldetails" style="margin-top:14px"></div>
  </div>

  <!-- ============================ the input ============================ -->
  <div class="card">
    <div id="drop">
      <div class="big" id="droptitle">Drop a telemetry file here</div>
      <div class="note" id="dropnote"></div>
      <input type="file" id="file" accept=".xlsx,.xlsm,.xls,.csv,.parquet" class="hidden">
    </div>
    <label class="row" style="margin-top:13px; cursor:pointer; gap:7px">
      <input type="checkbox" id="strict">
      <span>Only score drives with a full window</span>
      <span class="note" id="padnote"></span>
    </label>
    <div class="row" style="margin-top:13px" id="examples"></div>
    <div class="row" style="margin-top:8px" id="samples"></div>
    <p class="note" style="margin:12px 0 0" id="inputrules"></p>
  </div>

  <div id="status"></div>
  <div id="out"></div>
  <div class="card hidden" id="detail"></div>

</main>

<!-- Upload outcomes land here, pinned to the viewport: the results render below the
     fold, so without this a successful score looks identical to nothing happening. -->
<div id="toasts" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let META = null, RUN = null, KINDS = [], RESULT = null, LAST = null, CHOSEN = null;

const fmt = (x,d=3) => (x==null || Number.isNaN(x)) ? "—" : Number(x).toFixed(d);
const pct = x => x==null ? "—" : (100*x).toFixed(1) + "%";
const num = x => x==null ? "—" : Number(x).toLocaleString();
// The server rounds to a tenth, so anything quicker than that prints as "0s",
// which reads like a failure rather than a fast answer.
const secs = x => x < 0.05 ? "under 0.1s" : `${x}s`;
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLOR = { xgb:"var(--red)", cnn:"var(--blue)" };
const kindColor = k => COLOR[k] || "var(--grey)";
const est = k => RUN.estimators.find(e => e.kind === k);
const compact = n => n==null ? "—"
  : n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(0)+"M"
  : n >= 1e3 ? (n/1e3).toFixed(0)+"k" : String(n);

/* ---------------------------------------------------------------- theme */
const applyTheme = t => {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
};
applyTheme(localStorage.getItem("theme"));
$("#theme").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme");
  const next = now === "dark" ? "light" : now === "light" ? "" : "dark";
  next ? localStorage.setItem("theme", next) : localStorage.removeItem("theme");
  applyTheme(next);
  if (RESULT) render(RESULT);
};

/* ----------------------------------------------------------------- boot */
async function boot() {
  META = await (await fetch("/api/meta")).json();
  const pick = $("#runpick");
  pick.innerHTML = META.runs.map(r =>
    `<option value="${r.key}" ${r.key===META.active?"selected":""}>${esc(r.label)}</option>`
  ).join("");
  pick.onchange = () => selectRun(pick.value);
  selectRun(META.active);
}

function selectRun(key) {
  RUN = META.runs.find(r => r.key === key) || META.runs[0];
  KINDS = [RUN.default];
  renderModel();
  loadSamples();
  $("#out").innerHTML = ""; $("#status").innerHTML = "";
  $("#detail").classList.add("hidden");
  RESULT = null;
}

/* --------------------------------------------------------- the model card */
function renderModel() {
  const w = RUN.window_days, h = RUN.horizon_days;
  $("#hdr").textContent =
    `${w}-day window · predicts failure within ${h} days · `
    + `${RUN.attributes.length} SMART attributes → ${RUN.n_channels} channels`;
  $("#runtag").textContent = RUN.tag;
  $("#runnote").innerHTML =
    `<strong>${esc(RUN.scope)}.</strong> ${esc(RUN.note)}`
    + (RUN.n_drives ? ` <span class="mono">${num(RUN.n_drives)} drives, `
        + `${compact(RUN.n_drive_days)} drive-days</span>` : "");

  // estimator toggles
  const seg = $("#kindpick");
  const all = RUN.estimators.map(e => e.kind);
  seg.innerHTML = RUN.estimators.map(e =>
    `<button data-kind="${e.kind}" class="${KINDS.includes(e.kind)?"on":""}">
       <span class="swatch" style="background:${kindColor(e.kind)}"></span>${e.label}</button>`
  ).join("") + (all.length > 1
    ? `<button data-kind="__both" class="${KINDS.length>1?"on":""}">both</button>` : "");
  seg.querySelectorAll("button").forEach(b => b.onclick = () => {
    KINDS = b.dataset.kind === "__both" ? all.slice() : [b.dataset.kind];
    KINDS.sort((a,z) => (a!==RUN.default) - (z!==RUN.default));
    renderModel();
    if (LAST) LAST();
  });

  // one card per estimator, with its held-out test numbers
  $("#mcards").innerHTML = RUN.estimators.map(e => {
    const m = e.metrics || {};
    const on = KINDS.includes(e.kind);
    return `<div class="mcard ${on?"on":""}">
      <div class="hd">
        <span class="swatch" style="background:${kindColor(e.kind)}"></span>
        <strong>${e.label}</strong>
        ${e.is_default ? '<span class="pill tag">default</span>' : ""}
        <span class="spacer"></span>
        <span class="note mono">${esc(e.size)}</span>
      </div>
      <div class="note">${esc(e.blurb)}</div>
      <div class="mstats">
        <div><b>${fmt(m.pr_auc)}</b>PR-AUC</div>
        <div><b>${fmt(m.roc_auc)}</b>ROC-AUC</div>
        <div><b>${pct(m.precision)}</b>precision</div>
        <div><b>${pct(m.recall)}</b>recall</div>
        <div><b>${fmt(e.threshold)}</b>threshold</div>
      </div>
      <div class="note">${m.n
        ? `held out: ${num(m.n)} windows, ${num(m.n_pos)} of them positive
           (${pct(m.base_rate)} base rate)`
        : "no held-out metrics recorded for this run"}</div>
    </div>`;
  }).join("");

  $("#modeldetails").innerHTML = modelDetails();

  // input card copy, which is all window-length dependent
  // Only when no file is loaded: toggling estimators re-renders this card, and
  // wiping the filename would make the page look like it forgot what it just scored.
  if (!CHOSEN) {
    $("#droptitle").textContent = `Drop a telemetry file here`;
    $("#dropnote").innerHTML =
      `or click to choose &nbsp;·&nbsp; <span class="mono">.xlsx</span>,
       <span class="mono">.csv</span> or <span class="mono">.parquet</span>
       &nbsp;·&nbsp; one drive or a whole fleet`;
  }
  $("#padnote").innerHTML =
    `— a drive that stopped reporting partway through holds fewer than ${w} days. By
     default it is left-padded to ${w} and scored anyway, automatically and only where it
     is needed: the row is marked <span class="pill warn">partial</span> with the days it
     really had, and a drive that already holds ${w} days scores identically either way.
     Tick this to score continuous windows only — calibrated, but in a historical file it
     hides most of the drives that failed, because those are exactly the short ones.`;
  $("#inputrules").innerHTML =
    `The file needs a <span class="mono">date</span> column, a
     <span class="mono">serial_number</span> column, and at least <span class="mono">${w}
     </span> days per drive. Missing SMART columns are filled with the training-set
     median — the report below names exactly which ones were found. Gaps in the calendar
     are forward-filled and flagged to the model through an
     <span class="mono">observed</span> channel. Nothing is uploaded anywhere: the file is
     parsed in this process, scored, and dropped.`;
}

function modelDetails() {
  const t = RUN.tables || {};
  const bits = [];

  if (t.precision_at_k && t.precision_at_k.length) {
    const rows = t.precision_at_k;
    const cols = Object.keys(rows[0]).filter(c => c !== "K");
    bits.push(`<details><summary>Ranking quality on the held-out fleet — precision@K</summary>
      <p class="note" style="margin-top:0">Take the K highest-scoring drives and ask how
      many really did fail. This is the number that decides whether a maintenance queue
      is worth reading, and it is measured at the fleet's real failure rate.</p>
      <table><thead><tr><th>K</th>${cols.map(c =>
        `<th class="num">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr><td class="mono">${r.K}</td>${cols.map(c =>
        `<td class="num mono">${typeof r[c] === "number" && r[c] <= 1 && !Number.isInteger(r[c])
          ? fmt(r[c],3) : num(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table>
      </details>`);
  }

  if (t.importance && t.importance.length) {
    const max = Math.max(...t.importance.map(r => r.gain));
    bits.push(`<details><summary>What XGBoost leans on — share of total gain</summary>
      <p class="note" style="margin-top:0">Two features carry half the model:
      <span class="mono">smart_197</span> (pending sectors) differenced over 7 days, and
      <span class="mono">smart_5</span> (reallocated sectors) differenced over 1 day. Not
      the level of either counter — the <em>movement</em>.</p>
      <div class="contrib">${t.importance.map(r => `
        <span class="cname">${esc(r.feature)}</span>
        <span class="mono note" style="text-align:right">${fmt(r.gain,4)}</span>
        <span style="grid-column:1/3"><span class="cbar"><i style="left:0;
          width:${(100*r.gain/max).toFixed(1)}%;background:var(--red)"></i></span></span>
      `).join("")}</div></details>`);
  }

  if (t.channel_auc && t.channel_auc.length) {
    bits.push(`<details><summary>The leakage audit — is any single column just the label?</summary>
      <p class="note" style="margin-top:0">Every column is scored against
      <span class="mono">failure</span> before it is allowed near a model. A rank AUC near
      1.0 means the column <em>is</em> the outcome rather than evidence about it. The
      strongest surviving SMART channel reaches
      <strong>${fmt(RUN.max_channel_auc)}</strong> — signal, not an echo.
      ${RUN.leakage_checks_passed
        ? '<span class="pill ok">all checks passed</span>' : ""}</p>
      <table><thead><tr><th>Channel</th><th class="num">AUC vs the window label</th>
      </tr></thead><tbody>${t.channel_auc.map(r =>
        `<tr><td class="mono">${esc(r.channel)}</td>
         <td class="num mono">${fmt(r.auc_vs_window_label)}</td></tr>`).join("")}
      </tbody></table></details>`);
  }

  if (RUN.blocklist && RUN.blocklist.length) {
    bits.push(`<details><summary>Columns the model is forbidden to read
      (${RUN.blocklist.length})</summary>
      <p class="note" style="margin-top:0">These were measured to be proxies for the
      outcome rather than evidence about it, so they were dropped before training and are
      never read here — even when your file contains them. Example 3 below ships four of
      them on purpose so you can check.</p>
      <table><thead><tr><th style="width:290px">Blocked column</th><th>Why</th></tr>
      </thead><tbody>${RUN.blocklist.map(b =>
        `<tr><td class="mono">${esc(b.column)}</td>
         <td class="note">${esc(b.why)}</td></tr>`).join("")}</tbody></table>
      ${RUN.sparse_dropped.length ? `<p class="note">Also excluded, for coverage rather
        than leakage — reported by too small a slice of the archive to trust:
        <span class="mono">${RUN.sparse_dropped.join(", ")}</span>.</p>` : ""}
      </details>`);
  }

  if (RUN.tree_baseline) {
    const tb = RUN.tree_baseline;
    bits.push(`<details><summary>Why boosting, and not one big tree</summary>
      <p class="note" style="margin-top:0">A single decision tree grown until it could not
      fit the training set any better reached depth ${num(tb.actual_depth)} with
      ${num(tb.leaves)} leaves and ${fmt(tb.train_accuracy,5)} training accuracy — and
      ${fmt(tb.test_balanced_acc,3)} balanced accuracy on held-out data. It memorised the
      training set rather than learning anything transferable. That gap is the argument
      for an ensemble of shallow trees.</p></details>`);
  }

  bits.push(`<details><summary>The ${RUN.attributes.length} attributes this run reads</summary>
    <p class="note" style="margin-top:0">Each becomes ${1 + RUN.delta_lags.length} channels
    — the raw value plus its change over ${RUN.delta_lags.join(" and ")} day(s) — giving
    ${RUN.n_channels} in total, including the observed/imputed mask.</p>
    <div class="row">${RUN.attributes.map(a =>
      `<span class="chip mono" style="cursor:default">${esc(a)}</span>`).join("")}</div>
    </details>`);

  return bits.join("");
}

  $("#examples").innerHTML = ex.length
    ? `<span class="note">built to demo one behaviour each — hover for what:</span>`
      + ex.map(chip).join("") : "";
  $("#samples").innerHTML = fam.length
    ? `<span class="note">or a real workbook from
       <span class="mono">data/Toshiba/</span>:</span>` + fam.map(chip).join("") : "";

/* --------------------------------------------------------------- toasts */
/* The results card renders below the fold, so "it worked" and "nothing happened" look
   the same from the top of the page. Every upload now ends in a toast either way.
   Successes clear themselves; failures stay until dismissed, because an error you
   scrolled past is the thing that wasted your time in the first place. */
function toast({kind = "info", title, body = "", action = null, ms = 7000}) {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  const icon = kind === "ok" ? "✓" : kind === "err" ? "✕" : "•";
  el.innerHTML = `
    <div class="tt"><span style="color:var(--${
      kind === "ok" ? "green" : kind === "err" ? "red" : "blue"})">${icon}</span>
      <span>${esc(title)}</span>
      <button class="tx" title="dismiss">×</button></div>
    ${body ? `<div class="tb">${body}</div>` : ""}
    ${action ? `<button class="ta">${esc(action.label)}</button>` : ""}`;
  el.querySelector(".tx").onclick = () => el.remove();
  if (action) el.querySelector(".ta").onclick = () => { action.run(); el.remove(); };
  $("#toasts").appendChild(el);
  // Never let them stack past a handful; the oldest is the least interesting.
  const all = $$("#toasts .toast");
  if (all.length > 4) all[0].remove();
  if (ms) setTimeout(() => el.remove(), ms);
  return el;
}

/* ------------------------------------------------------------- requests */
/* XMLHttpRequest rather than fetch, purely for `upload.onprogress`: a 115k-row
   workbook is tens of megabytes and spends real time on the wire, and a spinner that
   cannot say whether it is at 5% or 95% is what makes an upload feel broken. */
function request(url, {method = "POST", body, headers = {}}, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open(method, url);
    for (const k in headers) xhr.setRequestHeader(k, headers[k]);
    if (onProgress && xhr.upload) {
      xhr.upload.onprogress = e => onProgress(e.lengthComputable ? e.loaded / e.total : null);
      xhr.upload.onload = () => onProgress(1);
    }
    xhr.onload = () => {
      let data;
      try { data = JSON.parse(xhr.responseText); }
      catch {
        return reject(new Error(xhr.status === 413
          ? "the file is larger than the 400 MB upload limit — score it as .csv or "
            + ".parquet, which are far smaller than .xlsx, or split it by drive"
          : `the server returned ${xhr.status} and not JSON`));
      }
      resolve({ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, data});
    };
    xhr.onerror = () => reject(new Error(
      "could not reach the server — is `python webapp/app.py` still running?"));
    xhr.onabort = () => reject(new Error("the upload was cancelled"));
    xhr.send(body);
  });
}

/* -------------------------------------------------------------- running */
function busy(label, withProgress) {
  $("#status").innerHTML = `
    <div class="card">
      <div><span class="spin"></span><span id="busytext">Uploading
        <strong>${esc(label)}</strong>…</span></div>
      <div class="prog ${withProgress ? "" : "indet"}"><i id="busybar"></i></div>
    </div>`;
  $("#out").innerHTML = ""; $("#detail").classList.add("hidden");
}
function phase(html, indeterminate) {
  const t = $("#busytext"); if (t) t.innerHTML = html;
  const p = $("#status .prog"); if (p) p.classList.toggle("indet", !!indeterminate);
}
function fail(label, msg) {
  $("#status").innerHTML = `<div class="err"><strong>${esc(label)}</strong> was not
    scored.<br>${esc(msg)}</div>`;
  toast({kind: "err", title: `${label} — not scored`, body: esc(msg), ms: 0});
}

async function send(url, opts, label, isUpload) {
  busy(label, isUpload);
  try {
    const r = await request(url, opts, isUpload ? frac => {
      const bar = $("#busybar");
      if (frac == null || !bar) return;
      bar.style.width = `${(frac * 100).toFixed(0)}%`;
      if (frac >= 1) phase(`Scoring <strong>${esc(label)}</strong>… a large workbook can
        take 20–30 seconds, nearly all of it spreadsheet parsing.`, true);
    } : null);
    if (!isUpload) phase(`Scoring <strong>${esc(label)}</strong>…`, true);

    if (!r.ok || r.data.error) {
      return fail(label, r.data.error || `the request failed (${r.status})`);
    }
    $("#status").innerHTML = "";
    RESULT = r.data;
    render(r.data);
    succeeded(label, r.data);
  } catch (e) {
    fail(label, e.message || String(e));
  }
}

/* What actually happened, in one line, pinned where you cannot miss it. */
function succeeded(label, d) {
  const g = d.diagnostics, s = d.summary[d.primary];
  const bits = [
    `<strong>${num(g.drives_scored)}</strong> drive${g.drives_scored === 1 ? "" : "s"}
     scored from ${num(g.rows)} rows in ${secs(d.seconds)}`,
    `<strong style="color:var(--red)">${num(s.inspect)}</strong> flagged
     <em>inspect</em>, ${num(s.hold)} <em>hold</em>`,
  ];
  if (g.attributes_missing.length)
    bits.push(`<span style="color:var(--warnink)">${g.attributes_missing.length} of
      ${RUN.attributes.length} attributes missing</span>, filled with the training median`);
  if (g.drives_skipped)
    bits.push(`<span style="color:var(--warnink)">${num(g.drives_skipped)} drive(s)
      skipped</span> for holding under ${d.min_days} days`);
  if (g.drives_padded)
    bits.push(`${num(g.drives_padded)} drive(s) left-padded — those scores are an
      extrapolation`);
  if (g.notes.length) bits.push(esc(g.notes.join("; ")));

  toast({
    kind: "ok",
    title: `${label} — scored`,
    body: bits.join("<br>"),
    action: {label: "show the ranking", run: showResults},
    ms: 9000,
  });
  // Jump to the table only if it is not already on screen, so re-running with a
  // different model does not yank the page around while you are reading it.
  const box = $("#out");
  const r = box.getBoundingClientRect();
  if (r.top > window.innerHeight * 0.75 || r.bottom < 0) showResults();
}
function showResults() {
  const box = $("#out");
  box.scrollIntoView({behavior: "smooth", block: "start"});
  const card = box.querySelector(".card");
  if (card) { card.classList.remove("flash"); void card.offsetWidth;
              card.classList.add("flash"); }
}

const padOn = () => !$("#strict").checked;
const runFile = f => {
  LAST = () => runFile(f);
  const fd = new FormData();
  fd.append("file", f); fd.append("pad", padOn() ? "1" : "0");
  fd.append("run", RUN.key); fd.append("models", KINDS.join(","));
  send("/api/predict", {method: "POST", body: fd}, f.name, true);
};
const runSample = (rel, label) => {
  LAST = () => runSample(rel, label);
  CHOSEN = null;
  send("/api/predict-sample",
    {method: "POST", headers: {"Content-Type": "application/json"},
     body: JSON.stringify({rel, pad: padOn(), run: RUN.key, models: KINDS})}, label, false);
};

/* --------------------------------------------------------------- charts */
function riskBar(v, thr, colour) {
  return `<span class="bar"><span class="fill" style="width:${(100*v).toFixed(1)}%;
    background:${colour}"></span><span class="thr"
    style="left:${(100*thr).toFixed(1)}%"></span></span>`;
}

function sparkline(values, w=193, h=36) {
  const v = values.filter(x => x!=null);
  if (!v.length) return `<svg width="${w}" height="${h}"></svg>`;
  const lo=Math.min(...v), hi=Math.max(...v), span=(hi-lo)||1;
  const pts = values.map((x,i) => x==null ? null :
    `${((i/Math.max(values.length-1,1))*(w-2)+1).toFixed(1)},${(h-2-((x-lo)/span)*(h-5)).toFixed(1)}`
  ).filter(Boolean).join(" ");
  return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${pts}"
    fill="none" stroke="${hi===lo?'var(--grey)':'var(--blue)'}" stroke-width="1.6"
    stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function trajectoryChart(traj, kinds, thresholds, w=720, h=150) {
  const dates = traj.dates, n = dates.length;
  if (n < 2) return `<p class="note">only one window available — no trajectory to draw.</p>`;
  const pad = {l:38, r:10, t:10, b:22};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const X = i => pad.l + (i/(n-1))*iw;
  const Y = v => pad.t + (1 - Math.max(0, Math.min(1, v)))*ih;
  const grid = [0, .25, .5, .75, 1].map(v =>
    `<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}"
       stroke="var(--line)" stroke-width="1"/>
     <text x="${pad.l-6}" y="${Y(v)+3.5}" text-anchor="end" font-size="10"
       fill="var(--muted)">${v.toFixed(2)}</text>`).join("");
  const lines = kinds.map(k => {
    const pts = traj[k].map((v,i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${kindColor(k)}"
      stroke-width="2" stroke-linejoin="round"/>
      <line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(thresholds[k])}" y2="${Y(thresholds[k])}"
        stroke="${kindColor(k)}" stroke-width="1" stroke-dasharray="3 3" opacity=".65"/>
      <circle cx="${X(n-1)}" cy="${Y(traj[k][n-1])}" r="3.2" fill="${kindColor(k)}"/>`;
  }).join("");
  const ticks = [0, Math.floor((n-1)/2), n-1].map(i =>
    `<text x="${X(i)}" y="${h-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}"
       font-size="10" fill="var(--muted)">${dates[i]}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"
    style="display:block;max-width:100%">${grid}${lines}${ticks}</svg>`;
}

function contribChart(items) {
  const max = Math.max(...items.map(x => Math.abs(x.contribution))) || 1;
  return `<div class="contrib">${items.map(x => {
    const frac = Math.abs(x.contribution)/max*49;
    const left = x.contribution >= 0 ? 50 : 50 - frac;
    return `<span class="cname">${esc(x.feature)}</span>
      <span class="mono note" style="text-align:right">${x.contribution>=0?"+":""}${
        fmt(x.contribution,2)}</span>
      <span style="grid-column:1/3"><span class="cbar">
        <span class="axis" style="left:50%"></span>
        <i style="left:${left}%;width:${frac}%;background:${
          x.contribution>=0?"var(--red)":"var(--green)"}"></i></span></span>`;
  }).join("")}</div>`;
}

            ${num(g.drives_padded)}</span> drive(s) held fewer than ${d.window_days} days

            prediction</div>` : ""}
        ${g.drives_skipped ? `<div><span class="pill warn">skipped
            ${num(g.drives_skipped)}</span> drive(s) with fewer than ${d.min_days} days —

              `<span class="mono">${esc(x.serial)}</span> (${x.days}d)`).join(", ")}</div>`

        ${g.has_failure_column ? `<div>the file carries a

        ${d.agreement ? `<div>both models call <strong>${d.agreement.both}</strong> drive(s)

function qualityCard(d) {
  const kinds = d.kinds.filter(k => d.quality[k]);
  if (!kinds.length) return "";
  const q0 = d.quality[kinds[0]];
  return `<div class="card">
    <h2>How the ranking did against this file's own ground truth</h2>
    <p class="note" style="margin-top:0">This file records
      <strong>${q0.n_failed}</strong> of its ${q0.n_drives} drives as failed. A handful of
      drives is a demonstration, not an evaluation — the held-out numbers on the model
      card above are the ones that mean something. But it is the obvious thing to check on
      a historical file, so: take the K highest-scoring drives and count the real failures
      among them.</p>
    <table><thead><tr><th>Model</th>${q0.at_k.map(a =>
      `<th class="num">top ${a.k}</th>`).join("")}
      <th class="num">recall @ ${q0.n_failed}</th>
      <th class="num">mean rank of the failures</th></tr></thead>
    <tbody>${kinds.map(k => {
      const q = d.quality[k];
      return `<tr><td><span class="swatch" style="background:${kindColor(k)}"></span>
        ${est(k).label}</td>
        ${q.at_k.map(a => `<td class="num mono">${a.hits}/${a.k}
          <span class="note">(${pct(a.precision)})</span></td>`).join("")}
        <td class="num mono">${pct(q.recall_at_n_pos)}</td>
        <td class="num mono">${fmt(q.mean_rank_of_failures,1)}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}

function downloadCsv(d) {
  const cols = ["rank","serial","drive_model","action","window_start","window_end",
                "n_real_days","n_filled_days","n_padded_days","days_available",
                "recorded_failure"];
  const head = ["rank","serial","drive_model"]
    .concat(d.kinds.map(k => `risk_${k}`))
    .concat(cols.slice(3));
  const line = r => ["rank","serial","drive_model"].map(c => r[c])
    .concat(d.kinds.map(k => r.scores[k].toFixed(6)))
    .concat(cols.slice(3).map(c => r[c]))
    .map(v => `"${String(v).replace(/"/g,'""')}"`).join(",");
  const csv = [head.join(",")].concat(d.rows.map(line)).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = d.source.replace(/\.[^.]+$/,"") + "_predictions.csv";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------------------------------------------------- drive detail */
async function showDrive(serial) {
  $$("#out tbody tr").forEach(tr =>
    tr.classList.toggle("sel", tr.dataset.serial === serial));
  const box = $("#detail"); box.classList.remove("hidden");
  box.innerHTML = `<span class="spin"></span>scoring the trailing windows for
    ${esc(serial)}…`;

  const d = await (await fetch(
    `/api/upload/${RESULT.token}/drive/${encodeURIComponent(serial)}`)).json();
  if (d.error) { box.innerHTML = `<p class="note">${esc(d.error)}</p>`; return; }

  const kinds = RESULT.kinds;
  const scores = kinds.map(k =>
    `<span style="font-size:19px;font-weight:650;color:${kindColor(k)}">${
      fmt(d.scores[k])}</span>
     <span class="note">${est(k).label}</span>`).join('<span style="width:14px"></span>');

  const traj = d.trajectory && d.trajectory.dates.length > 1 ? `
    <h2 style="margin-top:16px">Risk as the window slid forward</h2>
    <p class="note" style="margin-top:-6px">The same model, re-scored with the
      ${RESULT.window_days}-day window ending one day earlier each step, over the last
      ${d.trajectory.dates.length} days. Dashed line is the decision threshold. A drive
      climbing across it is deteriorating; one sitting above it has been ill for a while.</p>
    ${trajectoryChart(d.trajectory, kinds, RESULT.thresholds)}` : "";

  const expl = Object.keys(d.explanations || {}).map(k => `
    <h2 style="margin-top:16px">Why ${est(k).label} scored it ${fmt(d.scores[k])}</h2>
    <p class="note" style="margin-top:-6px">Exact SHAP contributions in log-odds for this
      one window: red pushed the score up, green pulled it down, and together with the
      model's base rate they sum to the logit of the score above. Feature names read
      <span class="mono">&lt;channel&gt;__&lt;aggregate&gt;</span> — so
      <span class="mono">smart_5_raw_d1__last</span> is the one-day change in reallocated
      sectors on the window's final day.</p>
    ${contribChart(d.explanations[k])}`).join("");

  const cards = d.attributes.map(a => {
    const cur = d.latest[a];
    return `<div class="spark"><div class="name">${esc(a)}</div>
      <div class="val">${cur==null ? "—" : cur.toLocaleString()}</div>
      <div class="med">last reading in the window</div>
      ${sparkline(d.series[a])}</div>`;
  }).join("");

  box.innerHTML = `
    <div class="row" style="margin-bottom:2px">
      <strong class="mono" style="font-size:16px">${esc(d.serial)}</strong>
      <span class="pill ${d.action==="inspect"?"act":"ok"}">${d.action}</span>
      <span class="note">rank ${d.rank} · ${esc(d.drive_model)}</span>
      <span class="spacer"></span>${scores}
    </div>
    <p class="note" style="margin-top:0">
      scored on ${d.window_start} → ${d.window_end}
      (${d.n_real_days} genuine readings${d.n_filled_days
        ? `, ${d.n_filled_days} forward-filled` : ""}${d.n_padded_days
        ? `, ${d.n_padded_days} padded` : ""})
      ${d.recorded_failure
        ? "· the file records this drive as <strong>failed</strong>" : ""}
    </p>
    ${traj}${expl}
    <h2 style="margin-top:16px">The ${d.dates.length} days behind the score</h2>
    <p class="note" style="margin-top:-6px">Raw reported values, in the units the file
      gave them — before the log1p, the differencing and the scaler. A flat grey line
      means the counter never moved.</p>
    <div class="grid">${cards}</div>`;
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ----------------------------------------------------------------- wire */
const drop = $("#drop"), input = $("#file");
const OK_EXT = [".xlsx", ".xlsm", ".xls", ".csv", ".txt", ".parquet"];
const sizeOf = b => b > 1e6 ? `${(b / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1e3))} kB`;

/* Checked here as well as on the server so the answer is instant, and so the reason is
   about the file you picked rather than a 400 from an endpoint you did not know about. */
function accept(f) {
  if (!f) return;
  const ext = (f.name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
  if (!OK_EXT.includes(ext)) {
    toast({kind: "err", ms: 0, title: `${f.name} — not a supported file`,
           body: `This reads <span class="mono">${OK_EXT.join("</span>, <span class='mono'>")}
                  </span>. A <span class="mono">${esc(ext) || "extension-less"}</span> file
                  cannot be parsed as a table.`});
    return;
  }
  if (f.size === 0) {
    toast({kind: "err", ms: 0, title: `${f.name} — the file is empty`});
    return;
  }
  CHOSEN = f;
  $("#droptitle").textContent = f.name;
  $("#dropnote").innerHTML = `${sizeOf(f.size)} · click to choose a different file`;
  runFile(f);
}

drop.onclick = () => input.click();
input.onchange = () => { accept(input.files[0]); input.value = ""; };
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => {
  ev.stopPropagation();
  const fs = ev.dataTransfer.files;
  if (fs.length > 1)
    toast({kind: "info", title: `${fs.length} files dropped`,
           body: `Only <span class="mono">${esc(fs[0].name)}</span> was scored — this
                  takes one file at a time.`});
  accept(fs[0]);
});

/* A file dropped anywhere but the zone makes the browser navigate to it, which throws
   away the page and any result on it. Swallow those and say where it should have gone. */
window.addEventListener("dragover", ev => ev.preventDefault());
window.addEventListener("drop", ev => {
  ev.preventDefault();
  if (ev.dataTransfer.files.length)
    toast({kind: "info", title: "Dropped outside the box",
           body: "Drop the file on the dashed area near the top of the page, or click it "
                 + "to browse."});
});

$("#strict").onchange = () => { if (LAST) LAST(); };

boot();
</script>
</body>
</html>
